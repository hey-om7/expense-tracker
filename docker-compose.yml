services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: vestor-backend
    restart: unless-stopped
    # Not published to the host: only nginx (frontend) can reach it. Publishing
    # it would let clients bypass nginx and spoof X-Forwarded-For to evade rate limits.
    expose:
      - "5001"
    env_file:
      - .env
    networks:
      - vestor-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: vestor-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - vestor-network

networks:
  vestor-network:
    driver: bridge
