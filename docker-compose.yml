services:
  backend:
    build:
      context: ./server
    container_name: wallo-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    networks:
      - wallo-network

  frontend:
    build:
      context: .
    container_name: wallo-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - wallo-network

networks:
  wallo-network:
    driver: bridge
