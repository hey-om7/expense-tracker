services:
  backend:
    build:
      context: ./server
    container_name: wallo-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173,http://16.16.25.128
    networks:
      - wallo-network

  frontend:
    build:
      context: .
      args:
        - VITE_API_URL=http://localhost:5000
    container_name: wallo-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - wallo-network

networks:
  wallo-network:
    driver: bridge
