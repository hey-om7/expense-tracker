# Usage:
#   cp .template.env .env   # fill in values
#   docker compose up --build
# App: http://localhost:${APP_PORT:-8080}
#
# Uses MONGO_URI from .env (e.g. MongoDB Atlas). To use the bundled local MongoDB instead:
#   docker compose --profile local-db up --build
# and set MONGO_URI=mongodb://mongo:27017/vestor in .env.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: vestor-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5001
    ports:
      - "${APP_PORT:-8080}:5001"

  mongo:
    image: mongo:7
    profiles: ["local-db"]
    container_name: vestor-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
